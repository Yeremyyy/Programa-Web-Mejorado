<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Prueba Html </title>
    <link rel="stylesheet" href="/css/stylos.css">
</head>
<body>
    
    <form id="registrationForm">

        <div>
            <h1>Registro de Usuario </h1>
        </div>
        
        <div>
            <label for="username">Nombre</label>
            <input type="text" id="username" name="username" required>
            <span class="error-message" id="usernameError"></span>
        </div>
        <div>
            <label for="email">Correo</label>
            <input type="text" id="email" name="email" required>
            <span class="error-message" id="emailError"></span>
        </div>
        <div>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
            <span class="error-message" id="passwordError"></span>
        </div>
        <div>
            <label for="confirmPassword">Confirmar</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required>
            <button type="button" id="togglePassword">👁️</button> <!--BOTON PARA OCULTAR CONTRASEÑA-->
            <span class="error-message" id="confirmPasswordError"></span>
        </div>
        <button type="submit" id="submitButton" disabled>Registrar</button>
        <div id="successMessage" class="success-message"></div>
    </form>
    <script src="script.js"></script>

    <!-- modal de confirmacion -->
    <div id="modalConfirmacion" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
    <div style="background:white; padding:30px; border-radius:10px; text-align:center; width:300px;">
        <h3>¿Confirmas el registro?</h3>
        <p><strong>Nombre:</strong> <span id="resumenNombre"></span></p>
        <p><strong>Correo:</strong> <span id="resumenCorreo"></span></p>
        <button type="button" id="btnConfirmar"> Confirmar</button>
        <button type="button" id="btnCancelar"> Cancelar</button>
    </div>
</div>
</body>
</html>
